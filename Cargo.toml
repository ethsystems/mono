[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ethsystems/works"

[workspace.dependencies]
include-utils = { version = "0.2.4", default-features = false }
rayon = { version = "1.10", default-features = false }
serde = { version = "1", default-features = false }
wincode = { version = "0.6", default-features = false }

# dev-dependencies
crabtime = { version = "1.1.4", default-features = false }
criterion = { version = "0.8", default-features = false }
proptest = { version = "1", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1

# constant-time crates need real codegen to keep their timing properties.
[profile.test]
opt-level = 2

[profile.profiling]
inherits = "release"
debug = true
