[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ethsystems/mono"

[profile.release]
lto = "fat"
codegen-units = 1

# constant-time crates need real codegen to keep their timing properties.
[profile.test]
opt-level = 2

[profile.profiling]
inherits = "release"
debug = true
